name: Update data and publish site

on:
  schedule:
    # Every 3 hours, 5 am to 10 pm US Eastern. Cron is UTC; times below are EST (an hour later during EDT).
    #   10=5a 13=8a 16=11a 19=2p 22=5p 01=8p 03=10p
    - cron: "7 10,13,16,19,22,1,3 * * *"   # :07 to avoid the top-of-hour rush on GitHub runners
  workflow_dispatch: {}
  push:
    branches: [main]

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't). Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: 'pip install --only-binary=:all: -r requirements.txt'

      - name: Fetch data and score
        env:
          PY: python
          NWS_CONTACT: ${{ vars.NWS_CONTACT || format('github.com/{0}', github.repository) }}
        run: ./update.sh

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html app.js _site/
          cp data/*.json _site/data/
          ls -la _site _site/data

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
